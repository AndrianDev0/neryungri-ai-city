name: Publish website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["static/**", "scripts/build_pages.py", ".github/workflows/pages.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ vars.API_BASE != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build client
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: python scripts/build_pages.py --api-base "$API_BASE"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: output/pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
